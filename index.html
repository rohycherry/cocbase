<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 - Bangladesh Time</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:10px;
    color:#38bdf8;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:30px;
}

.match-card{
    background:#1e293b;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 0 10px rgba(255,255,255,.1);
}

.stage{
    color:#fbbf24;
    margin-bottom:10px;
    font-size:14px;
}

.teams{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.time{
    color:#22c55e;
}

.loading{
    text-align:center;
    color:#94a3b8;
}
</style>
</head>
<body>

<div class="container">

<h1>⚽ FIFA World Cup 2026</h1>
<div class="subtitle">
Bangladesh Time (GMT+6)
</div>

<div id="matches">

<div class="loading">
Loading matches...
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
