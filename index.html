<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIFA 2026 Schedule (BD Time)</title>

<style>
body{
background:#111827;
color:white;
font-family:Arial;
max-width:700px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
color:#00e5ff;
}

.card{
background:#1f2937;
padding:15px;
margin:10px 0;
border-radius:15px;
}

.time{
color:#00ff99;
font-weight:bold;
}

.stage{
color:gold;
}
</style>
</head>
<body>

<h1>⚽ FIFA World Cup 2026</h1>

<div id="matches">
Loading...
</div>

<script>

async function loadMatches(){

const container=document.getElementById("matches");

try{

// Example data source
const res=await fetch(
"https://raw.githubusercontent.com/openfootball/world-cup.json/master/2018--russia/cup.json"
);

const data=await res.json();

container.innerHTML="";

data.matches.slice(0,20).forEach(match=>{

let bdTime="Unknown";

if(match.date){

const d=new Date(match.date);

bdTime=d.toLocaleString("en-BD",{
timeZone:"Asia/Dhaka",
dateStyle:"medium",
timeStyle:"short"
});

}

container.innerHTML+=`
<div class="card">
<div class="stage">${match.group || ""}</div>

<div>
${match.team1.name}
vs
${match.team2.name}
</div>

<div class="time">
🇧🇩 ${bdTime}
</div>

</div>
`;

});

}catch(e){

container.innerHTML="Failed to load data";

}

}

loadMatches();

</script>

</body>
</html>
